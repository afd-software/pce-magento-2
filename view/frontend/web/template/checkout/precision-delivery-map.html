<!-- ko if: config.enabled && visible() -->
<div class="afd-precision-delivery-container" data-bind="visible: visible">
  <div class="afd-precision-delivery-header">
    <h4
      class="afd-precision-delivery-title"
      data-bind="i18n: 'Precision Delivery'"
    ></h4>
    <p
      class="afd-precision-delivery-instructions"
      data-bind="text: getInstructionText()"
    ></p>
  </div>

  <div class="afd-precision-delivery-map-wrapper">
    <!-- ko if: mapLoaded() -->
    <div
      class="afd-precision-delivery-map"
      data-bind="attr: { id: getMapContainerId() }"
      style="width: 100%; height: 300px"
    ></div>
    <!-- /ko -->

    <!-- ko ifnot: mapLoaded() -->
    <div class="afd-precision-delivery-loading">
      <span data-bind="i18n: 'Loading map...'"></span>
    </div>
    <!-- /ko -->
  </div>

  <!-- Delivery Notes Textarea -->
  <!-- ko if: config.enableDeliveryNotes -->
  <div class="afd-precision-delivery-notes">
    <label
      class="label"
      for="afd-delivery-notes"
      data-bind="i18n: 'Delivery Instructions'"
    ></label>
    <textarea
      id="afd-delivery-notes"
      class="input-text afd-delivery-notes-input"
      data-bind="value: deliveryNotes,
                             attr: { placeholder: getDeliveryNotesPlaceholder() }"
      rows="3"
      maxlength="500"
    ></textarea>
  </div>
  <!-- /ko -->

  <!-- Warning Modal -->
  <!-- ko if: warningVisible() -->
  <div class="afd-precision-delivery-warning-overlay">
    <div class="afd-precision-delivery-warning-modal">
      <div class="afd-precision-delivery-warning-content">
        <h4 data-bind="i18n: 'Distance Warning'"></h4>
        <p data-bind="text: getWarningMessage()"></p>
      </div>
      <div class="afd-precision-delivery-warning-actions">
        <button
          type="button"
          class="action secondary"
          data-bind="click: cancelWarning"
        >
          <span data-bind="i18n: 'Reset Location'"></span>
        </button>
        <button
          type="button"
          class="action primary"
          data-bind="click: confirmWarning"
        >
          <span data-bind="i18n: 'Confirm Location'"></span>
        </button>
      </div>
    </div>
  </div>
  <!-- /ko -->
</div>
<!-- /ko -->
