<div
  class="shipping-address-item"
  css="'selected-item' : isSelected() , 'not-selected-item':!isSelected()"
>
  <text args="address().prefix"></text>
  <text args="address().firstname"></text>
  <text args="address().middlename"></text>
  <text args="address().lastname"></text> <text args="address().suffix"></text
  ><br />
  <text args="_.values(address().street).join(', ')"></text><br />
  <text args="address().city "></text>, <span text="address().region"></span>
  <text args="address().postcode"></text><br />
  <text args="getCountryName(address().countryId)"></text><br />
  <a
    if="address().telephone"
    attr="'href': 'tel:' + address().telephone"
    text="address().telephone"
  ></a
  ><br />

  <each args="data: address().customAttributes, as: 'element'">
    <each args="data: Object.keys(element), as: 'attribute'">
      <if args="typeof element[attribute] === 'object'">
        <if args="element[attribute].attribute_code.substring(0, 4) !== 'afd_'">
          <if args="element[attribute].label">
            <text args="element[attribute].label" />
          </if>
          <ifnot args="element[attribute].label">
            <if args="element[attribute].value">
              <text args="element[attribute].value" />
            </if>
          </ifnot>
          <br />
        </if>
      </if>
      <if args="typeof element[attribute] === 'string'">
        <if args="element.attribute_code.substring(0, 4) !== 'afd_'">
          <text args="element[attribute]" />
          <br />
        </if>
      </if>
    </each>
  </each>

  <!-- Precision Delivery Static Map -->
  <!-- ko if: isPrecisionDeliveryEnabled() && getStaticMapUrl() -->
  <div class="afd-precision-delivery-preview">
    <div
      class="afd-precision-delivery-preview-label"
      data-bind="i18n: 'Delivery Location'"
    ></div>
    <img
      class="afd-precision-delivery-static-map"
      data-bind="attr: { src: getStaticMapUrl(), alt: 'Delivery Location' }"
    />
    <!-- ko if: getDeliveryNotes() -->
    <div class="afd-precision-delivery-preview-notes">
      <span class="label" data-bind="i18n: 'Notes:'"></span>
      <span class="value" data-bind="text: getDeliveryNotes()"></span>
    </div>
    <!-- /ko -->
  </div>
  <!-- /ko -->

  <!-- Add Precise Delivery Data Button (when no data exists) -->
  <!-- ko if: isPrecisionDeliveryEnabled() && !getStaticMapUrl() -->
  <div class="afd-precision-delivery-add">
    <button
      type="button"
      class="action secondary afd-add-precision-data-btn"
      data-bind="click: openPrecisionDeliveryModal"
    >
      <span data-bind="i18n: 'Add Precise Delivery Location'"></span>
    </button>
  </div>
  <!-- /ko -->

  <button
    visible="address().isEditable()"
    type="button"
    class="action edit-address-link"
    click="editAddress"
  >
    <span translate="'Edit'"></span>
  </button>
  <!-- ko if: (!isSelected()) -->
  <button
    type="button"
    click="selectAddress"
    class="action action-select-shipping-item"
  >
    <span translate="'Ship Here'"></span>
  </button>
  <!-- /ko -->
</div>
